name: Bug report
description: Report a bug in Scissors that does NOT occur on unmodified Paper.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Scissors is a fork of Paper. A bug that also happens on an unmodified Paper
        server of the same version is an **upstream Paper bug**, not a Scissors bug —
        report those to [PaperMC](https://github.com/PaperMC/Paper/issues) instead.

        This form is only for bugs introduced by Scissors. You must show the bug
        reproduces on Scissors **and does not** reproduce on unmodified Paper.
  - type: textarea
    id: scissors-version
    attributes:
      label: Scissors version
      description: >
        Paste the full output of the `/version` command from your server. It includes
        everything needed to identify your build: the Minecraft version, the Scissors
        build number and commit, whether you are behind the latest build, and the
        upstream Paper build Scissors is based on. Automatically formatted, no
        backticks needed.
      render: text
      placeholder: |
        This server is running Scissors version 26.2-10-master@4abd686 (2026-07-29T03:03:51Z) (Implementing API version 26.2.build.10-stable)
        You are running the latest version
        Based on Paper build 87 (a95ae8d)
    validations:
      required: true
  - type: input
    id: paper-version
    attributes:
      label: Paper build tested against
      description: >
        The unmodified Paper build you confirmed the bug does NOT occur on. Must be the
        same Minecraft version. `/version` on Scissors shows which Paper build your
        Scissors build is based on — test against that one.
      placeholder: "e.g. Paper build 62 (Minecraft 26.2)"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact steps a maintainer can follow to see the bug on Scissors.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: paper-evidence
    attributes:
      label: Evidence it does NOT happen on unmodified Paper
      description: >
        Irrefutable proof this is Scissors-specific. Run the exact same steps on an
        unmodified Paper server of the same Minecraft version and show the different
        result. Provide concrete evidence: a video or screenshots of both runs
        side by side, console logs from both servers, or a clear step-by-step
        comparison. "I think it's Scissors" is not enough — reports without this
        will be closed.
      placeholder: |
        Paper build & version tested:
        Same steps on Paper produced: ...
        Attached: paper-run.mp4 / paper-console.log, scissors-run.mp4 / scissors-console.log
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace (Scissors)
      description: Relevant server console output or stack trace from Scissors. Automatically formatted, no backticks needed.
      render: text
    validations:
      required: false
  - type: textarea
    id: plugins
    attributes:
      label: Plugins
      description: List installed plugins, or state that the bug reproduces with no plugins loaded (strongly preferred).
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this bug has not already been reported.
          required: true
        - label: I am running the latest Scissors build (`/version` says "You are running the latest version", or I updated and the bug still occurs).
          required: true
        - label: I tested the same Minecraft version on both Scissors and unmodified Paper.
          required: true
        - label: I confirmed the bug does NOT occur on unmodified Paper, and provided evidence above.
          required: true
        - label: This is a bug report, not a crash/exploit. Security findings go through the exploit finding form.
          required: true
