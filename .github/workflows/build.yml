name: Patch and Build

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo, and skip
    # pushes to master on the main repo — the publish job builds those itself
    if: >-
      ${{ (github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name)
      && !(github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'ScissorsMC/Scissors') }}
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure Git User Details
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"
      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build
        run: ./gradlew build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'ScissorsMC/Scissors'
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    # Secrets live in the 'fill' environment, whose deployment branch policy only
    # allows master — GitHub enforces that server-side, unlike the 'if' above.
    environment: fill
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          # Full history so publishToFill can gather the commits since the last published build
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure Git User Details
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"
      - name: Set Build Time
        # Stamps the jar manifest's Build-Time (defaults to 1970 epoch otherwise)
        # and the published build's timestamp in Fill
        run: echo "BUILD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Allocate Build Number
        # Runs before Apply Patches so the Build and Publish steps see the same
        # BUILD_NUMBER and produce identical task inputs — otherwise publish
        # rebuilds every jar with the real build number
        env:
          BUILD_NUMBER_TOKEN: ${{ secrets.BUILD_NUMBER_TOKEN }}
        run: |
          track="scissors-$(grep -oP '^mcVersion=\K.*' gradle.properties)"
          number="$(
            curl --fail-with-body --max-time 30 -X POST \
              -H "Authorization: Bearer $BUILD_NUMBER_TOKEN" \
              "https://numbers.scissors.gg/v1/tracks/$track/next" \
            | jq -er '.number'
          )"
          echo "BUILD_NUMBER=$number" >> "$GITHUB_ENV"
      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build
        # Runs before publish so a compile or test failure blocks the release.
        # createPaperclipJar is the artifact fill publishes — building it here lets
        # it assemble in parallel with the tests, leaving the publish step upload-only
        run: ./gradlew build :scissors-server:createPaperclipJar --stacktrace
      - name: Publish to Fill
        env:
          FILL_API_URL: ${{ secrets.FILL_API_URL }}
          FILL_API_KEY: ${{ secrets.FILL_API_KEY }}
        # fill-gradle 1.0.12 is not configuration-cache compatible
        run: ./gradlew :scissors-server:publishToFill --no-configuration-cache --stacktrace
